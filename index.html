<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bảo Tín Thanh Thủy - Bảng Giá Live</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;600;700&display=swap');

  /* === GIAO DIỆN MẶC ĐỊNH: ĐEN TUYỆT ĐỐI (#000000) === */
  :root {
    --bg: #000000;
    --panel: #000000;
    --line: #222222;
    --silver: #c7cdd4;
    --text: #e8ecef;
    --up: #00c853;
    --down: #ff3d00;
  }

  /* === GIAO DIỆN SÁNG MÀU === */
  body.light-mode {
    --bg: #f1f5f9;
    --panel: #ffffff;
    --line: #cbd5e1;
    --silver: #475569;
    --text: #0f172a;
    --up: #059669; 
    --down: #dc2626; 
  }

  body.light-mode .vn-title { color: #475569; }
  body.light-mode .price-label { color: #64748b; }
  body.light-mode .source-badge { color: #475569; background: #f1f5f9; border-color: #cbd5e1; }
  body.light-mode .chart-header { color: #0f172a; }
  body.light-mode .vn-footer { color: #64748b; }

  *{box-sizing:border-box; margin:0; padding:0;}
  
  body{
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--text);
    padding: 0 8px 16px 8px;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    transition: background-color 0.2s, color 0.2s;
  }
  
  /* CẤU TRÚC GỐC CHUẨN KÈM DỰ PHÒNG CHO TIZEN OS */
  .wrap{
    display:grid;
    grid-template-columns: 1fr 380px;
    grid-template-columns: minmax(0, 1fr) clamp(360px, 30vw, 420px);
    gap:8px;
    width:100%;
    height:100%;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    transition: background-color 0.2s, border-color 0.2s;
  }
  
  .chart-panel{
    grid-column:1;
    height:100%;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .chart-header{
    display:flex; align-items:center; gap:8px;
    padding:8px 12px;
    border-bottom:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--silver);
    flex-shrink:0;
  }
  .chart-header .dot{width:7px;height:7px;border-radius:50%;background:var(--silver);}

  .theme-toggle-btn {
    margin-left: auto;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .theme-toggle-btn:hover {
    opacity: 0.9;
    transform: scale(1.03);
  }

  #tv_chart{ flex:1; min-height:0; width:100%; }

  .right-col{
    grid-column:2;
    display:flex;
    flex-direction:column;
    gap:6px;
    height:100%;
    min-height:0;
  }

  .ticker{
    flex:1;
    min-height:0;
    position: relative;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    transition: background-color 0.2s, border-color 0.2s;
  }

  .source-badge {
    position: absolute;
    bottom: 6px;
    right: 8px;
    font-size: 8px;
    color: #6e7681;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    text-transform: uppercase;
    z-index: 10;
    pointer-events: none;
    background: var(--bg);
    padding: 2px 4px;
    border-radius: 4px;
    border: 1px solid var(--line);
  }

  .widget-box {
    width: 81.25% !important;
    height: 81.25% !important;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1.231) !important;
    transform-origin: center center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .widget-box iframe {
    width: 100% !important;
    height: 100% !important;
    border: none;
  }

  .vn-silver-card {
    width: 100%;
    height: 100%;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    background: var(--panel);
  }

  .vn-title {
    font-size: 10px;
    font-weight: 700;
    color: #8b98a5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .live-tag {
    font-size: 8px;
    padding: 2px 4px;
    background: rgba(0, 200, 83, 0.15);
    color: var(--up);
    border-radius: 4px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .live-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--up);
    animation: blink 1.5s infinite;
  }

  @keyframes blink {
    0% { opacity: 1; }
    50% { opacity: 0.3; }
    100% { opacity: 1; }
  }

  .vn-price-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 2px;
  }

  .price-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .price-label {
    font-size: 9px;
    color: #6e7681;
    margin-bottom: 1px;
  }

  .price-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px !important;
    font-weight: 700;
    white-space: nowrap;
    transition: color 0.3s ease;
  }
  .buy-color { color: var(--down); }
  .sell-color { color: var(--up); }

  .price-val.flash-up { color: var(--up) !important; }
  .price-val.flash-down { color: var(--down) !important; }

  .vn-footer {
    font-size: 8px;
    color: #484f58;
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
  }

  /* TỐI ƯU HÓA LẠI TỶ LỆ CHO SMART TV (2K, 4K) TRÁNH TRÀN KHUNG */
  @media (min-width: 1900px) {
    .wrap { grid-template-columns: minmax(0, 1fr) 23vw; }
    .widget-box {
      width: 71.4% !important;
      height: 71.4% !important;
      transform: translate(-50%, -50%) scale(1.4) !important;
    }
    .price-val { font-size: 38px !important; }
    .vn-title { font-size: 12px !important; }
    .price-label { font-size: 11px !important; }
    .vn-footer { font-size: 10px !important; }
  }

  @media (min-width: 2500px) {
    .wrap { grid-template-columns: minmax(0, 1fr) 22vw; }
    .widget-box {
      width: 55.5% !important;
      height: 55.5% !important;
      transform: translate(-50%, -50%) scale(1.8) !important;
    }
    .price-val { font-size: 48px !important; }
    .vn-title { font-size: 14px !important; }
    .price-label { font-size: 13px !important; }
    .vn-footer { font-size: 11px !important; }
    .source-badge { font-size: 10px !important; bottom: 8px; right: 10px;}
  }

  @media (min-width: 3800px) {
    .wrap { grid-template-columns: minmax(0, 1fr) 20vw; }
    .widget-box {
      width: 45.4% !important;
      height: 45.4% !important;
      transform: translate(-50%, -50%) scale(2.2) !important;
    }
    .price-val { font-size: 60px !important; }
    .vn-title { font-size: 18px !important; }
    .price-label { font-size: 16px !important; }
    .vn-footer { font-size: 14px !important; }
    .source-badge { font-size: 12px !important; padding: 4px 8px; }
  }

  @media (max-width: 768px){
    body{ padding:6px; height:auto; overflow:auto; }
    .wrap{
      grid-template-columns: 1fr;
      gap:6px;
      height:auto;
    }
    .chart-panel{
      grid-column:1;
      height:50vh;
      min-height:300px;
    }
    .right-col{
      grid-column:1;
      height:auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .right-col > .ticker:first-child {
      grid-column: span 2;
    }
    .ticker{
      height:125px;
    }
    .price-val {
      font-size: 32px !important;
    }
    .widget-box {
      width: 81.25% !important;
      height: 81.25% !important;
      transform: translate(-50%, -50%) scale(1.231) !important;
      transform-origin: center center;
    }
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- CHART BẠC -->
  <div class="panel chart-panel">
    <div class="chart-header">
      <span class="dot"></span> Bạc / Đô la Mỹ (XAG/USD) · OANDA
      <button id="theme-toggle" class="theme-toggle-btn">☀️ Sáng / Tối</button>
    </div>
    <div id="tv_chart"></div>
  </div>

  <!-- CỘT GIÁ PHẢI (5 Ô) -->
  <div class="right-col">

    <!-- 1. BẠC PHÚ QUÝ -->
    <div class="ticker">
      <div class="vn-silver-card">
        <div class="vn-title">
          <span>BẠC VN (PHÚ QUÝ)</span>
          <span class="live-tag"><span class="live-dot"></span> LIVE TRỰC TIẾP</span>
        </div>
        <div class="vn-price-grid">
          <div class="price-box">
            <span class="price-label">MUA VÀO (tr/Kg)</span>
            <span class="price-val buy-color" id="buy_price">--.---</span>
          </div>
          <div class="price-box">
            <span class="price-label">BÁN RA (tr/Kg)</span>
            <span class="price-val sell-color" id="sell_price">--.---</span>
          </div>
        </div>
        <div class="vn-footer" id="update_time">Đang kết nối...</div>
      </div>
    </div>

    <!-- 2. BẠC XAGUSD QUỐC TẾ -->
    <div class="ticker">
      <div class="source-badge">Nguồn: OANDA</div>
      <div class="widget-box" id="widget-xagusd"></div>
    </div>

    <!-- 3. VÀNG XAUUSD -->
    <div class="ticker">
      <div class="source-badge">Nguồn: OANDA</div>
      <div class="widget-box" id="widget-xauusd"></div>
    </div>

    <!-- 4. GIÁ DẦU THÔ (UKOIL) -->
    <div class="ticker">
      <div class="source-badge">Nguồn: TVC</div>
      <div class="widget-box" id="widget-ukoil"></div>
    </div>

    <!-- 5. CHỈ SỐ DXY (ĐÔ LA MỸ) -->
    <div class="ticker">
      <div class="source-badge">Nguồn: CAPITALCOM</div>
      <div class="widget-box" id="widget-dxy"></div>
    </div>

  </div>

</div>

<!-- THƯ VIỆN BẮT BUỘC CỦA TRADINGVIEW -->
<script src="https://s3.tradingview.com/tv.js"></script>

<script>
  const themeBtn = document.getElementById('theme-toggle');
  let currentTheme = localStorage.getItem('theme') || 'dark';

  if (currentTheme === 'light') {
    document.body.classList.add('light-mode');
    if (themeBtn) themeBtn.innerText = '🌙 Chế độ Tối';
  } else {
    if (themeBtn) themeBtn.innerText = '☀️ Chế độ Sáng';
  }

  if (themeBtn) {
    themeBtn.addEventListener('click', () => {
      if (document.body.classList.contains('light-mode')) {
        document.body.classList.remove('light-mode');
        localStorage.setItem('theme', 'dark');
        themeBtn.innerText = '☀️ Chế độ Sáng';
      } else {
        document.body.classList.add('light-mode');
        localStorage.setItem('theme', 'light');
        themeBtn.innerText = '🌙 Chế độ Tối';
      }
      location.reload();
    });
  }

  new TradingView.widget({
    "container_id": "tv_chart",
    "autosize": true,
    "symbol": "OANDA:XAGUSD",
    "interval": "1",
    "timezone": "Asia/Ho_Chi_Minh",
    "theme": currentTheme === 'light' ? 'light' : 'dark',
    "style": "1",
    "locale": "vi_VN",
    "toolbar_bg": currentTheme === 'light' ? "#ffffff" : "#000000",
    "enable_publishing": false,
    "hide_top_toolbar": false,
    "hide_legend": false,
    "save_image": false,
    "backgroundColor": currentTheme === 'light' ? "#ffffff" : "#000000",
    "gridColor": currentTheme === 'light' ? "rgba(0,0,0,0.06)" : "rgba(255,255,255,0.06)",
    "enabled_features": ["left_toolbar"],
    "studies": []
  });

  function loadWidget(symbol, containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    const script = document.createElement('script');
    script.type = 'text/javascript';
    script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js';
    script.async = true;
    script.innerHTML = JSON.stringify({
      "symbol": symbol,
      "width": "100%",
      "colorTheme": currentTheme === 'light' ? 'light' : 'dark',
      "isTransparent": true,
      "locale": "vi_VN"
    });
    container.appendChild(script);
  }

  loadWidget("OANDA:XAGUSD", "widget-xagusd");
  loadWidget("OANDA:XAUUSD", "widget-xauusd");
  loadWidget("TVC:UKOIL", "widget-ukoil");
  loadWidget("CAPITALCOM:DXY", "widget-dxy");

  const WORKER_URL = 'https://giabac.quyetyhct.workers.dev/gia-bac';
  let lastBuy = 0;
  let lastSell = 0;

  async function fetchVNSilverPrice() {
    try {
      // 1. KÉO TRỰC TIẾP TỪ PHÚ QUÝ ĐỂ LẤY SỐ GỐC (Bỏ qua Worker làm tròn)
      const targetUrl = encodeURIComponent('https://giabac.phuquygroup.vn/');
      const response = await fetch(`https://api.allorigins.win/get?url=${targetUrl}`);
      
      if (response.ok) {
        const proxyData = await response.json();
        const textData = proxyData.contents; 
          
        // Quét chính xác dải số có dấu phẩy/chấm theo định dạng hàng chục triệu (VD: 57,199,857)
        const regex = /([0-9]{2})[,.]([0-9]{3})[,.]([0-9]{3})/g;
        const matches = textData.match(regex);
        
        if (matches && matches.length >= 2) {
           // Biến 57,199,857 thành số 57.199857 để hàm phía dưới xử lý chuỗi
           const buyVal = parseFloat(matches[0].replace(/[,.]/g, '')) / 1000000;
           const sellVal = parseFloat(matches[1].replace(/[,.]/g, '')) / 1000000;
           
           updatePrice(buyVal, sellVal);
           return;
        }
      }
    } catch (e) {
      console.error("Lỗi lấy giá trực tiếp:", e);
    }

    // 2. DỰ PHÒNG QUA WORKER (Nếu Proxy bị nghẽn)
    try {
      const response = await fetch(WORKER_URL);
      if (response.ok) {
        const data = await response.json();
        let buyVal = data.buyRaw ? (parseFloat(data.buyRaw) / 1000000) : parseFloat(data.buy);
        let sellVal = data.sellRaw ? (parseFloat(data.sellRaw) / 1000000) : parseFloat(data.sell);
        if (!isNaN(buyVal) && !isNaN(sellVal)) {
          updatePrice(buyVal, sellVal);
          return;
        }
      }
    } catch (e) {}

    // 3. Nếu lỗi cả 2 nguồn
    if (lastBuy > 0) updatePrice(lastBuy, lastSell);
    else showErrorState("Đang cập nhật...");
  }

  function updatePrice(buyVal, sellVal) {
    const buyEl = document.getElementById('buy_price');
    const sellEl = document.getElementById('sell_price');
    const timeEl = document.getElementById('update_time');

    applyPriceWithFlash(buyEl, buyVal, lastBuy);
    applyPriceWithFlash(sellEl, sellVal, lastSell);

    lastBuy = buyVal;
    lastSell = sellVal;

    const now = new Date();
    timeEl.innerText = 'Cập nhật: ' + now.toLocaleTimeString('vi-VN');
  }

  function showErrorState(msg) {
    document.getElementById('update_time').innerText = msg;
  }

  function applyPriceWithFlash(element, newVal, oldVal) {
    // Ép biến số thành đoạn chữ để dùng "kéo" cắt, KHÔNG BAO GIỜ bị làm tròn
    let numStr = String(newVal); 
    let parts = numStr.split('.');
    
    let intPart = parts[0];
    
    // Cắt chính xác 3 số đầu của phần thập phân (vd: 199), nếu thiếu tự bù thêm số 0
    let decPart = parts[1] ? parts[1].substring(0, 3) : '000';
    decPart = decPart.padEnd(3, '0');
    
    // In ra màn hình (ví dụ: 57,199)
    element.innerText = intPart + ',' + decPart;
    
    if (oldVal > 0) {
      if (newVal > oldVal) {
        element.classList.add('flash-up');
        setTimeout(() => element.classList.remove('flash-up'), 1000);
      } else if (newVal < oldVal) {
        element.classList.add('flash-down');
        setTimeout(() => element.classList.remove('flash-down'), 1000);
      }
    }
  }

  fetchVNSilverPrice();
  setInterval(fetchVNSilverPrice, 15000);
</script>
</body>
</html>
