<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bảo Tín Thanh Thủy - Bảng Giá Live</title>

<!-- 🟢 BỘ FAVICON TIÊU CHUẨN CHO TRÌNH DUYỆT & ĐIỆN THOẠI 🟢 -->
<link rel="icon" href="logo.png" sizes="32x32" type="image/png">
<link rel="icon" href="logo.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="logo.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;600;700&display=swap');

  :root{
    --bg: #0b0d0f;
    --panel: #12161a;
    --line: #232a30;
    --silver: #c7cdd4;
    --text: #e8ecef;
    --up: #00c853;
    --down: #ff3d00;
  }
  *{box-sizing:border-box; margin:0; padding:0;}

  html, body {
    height: 100%;
    margin: 0;
  }

  body{
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--text);
    padding: clamp(8px, 1.5vh, 16px);
    height: 100dvh; 
    overflow: hidden; 
  }
  
  /* GIAO DIỆN MÁY TÍNH (GRID 2 CỘT) */
  .wrap{
    display:grid;
    grid-template-columns: minmax(0, 1fr) clamp(250px, 25vw, 420px); 
    gap: clamp(6px, 1vw, 12px);
    width:100%;
    height:100%;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
  }
  
  .chart-panel{
    grid-column:1;
    height:100%;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  
  .chart-header{
    display:flex; align-items:center; gap:8px;
    padding: 12px 16px; 
    border-bottom:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;
    font-size: clamp(12px, 1.2vw, 16px); 
    color:var(--silver);
    flex-shrink:0;
  }
  
  /* CSS CHO LOGO (TỰ NHIÊN, CÂN ĐỐI) */
  .brand-logo {
    height: 55px; /* Kích thước cân đối, không ép 90px nữa */
    width: auto;
    object-fit: contain;
    margin-right: 12px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .chart-header .dot{
    width: clamp(6px, 0.8vw, 10px);
    height: clamp(6px, 0.8vw, 10px);
    border-radius:50%;
    background:var(--silver);
  }
  #tv_chart{ flex:1; min-height:0; width:100%; }

  .right-col{
    grid-column:2;
    display:flex;
    flex-direction:column;
    gap: clamp(4px, 0.8vh, 8px);
    height:100%;
    min-height:0;
  }

  .ticker{
    flex:1;
    min-height: 0; 
    position: relative;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  /* Ô BẠC PHÚ QUÝ ĐẦU TIÊN */
  .ticker:first-child {
    flex: 1.2; 
  }
  
  /* CỠ CHỮ BẠC PHÚ QUÝ ĐƯỢC GIỮ NGUYÊN (LỚN RÕ RÀNG) */
  .ticker:first-child .price-val {
    font-size: 38px !important; 
  }
  .ticker:first-child .price-label {
    font-size: 14px !important; 
    margin-bottom: 6px;
  }

  .source-badge {
    position: absolute;
    bottom: clamp(4px, 0.5vw, 8px);
    right: clamp(6px, 1vw, 12px);
    font-size: clamp(7px, 0.8vw, 10px);
    color: #6e7681;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    text-transform: uppercase;
    z-index: 10;
    pointer-events: none;
    background: var(--bg);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--line);
  }

  .widget-box {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .widget-box iframe {
    width: 100% !important;
    height: 100% !important;
    border: none;
  }

  .vn-silver-card {
    width: 100%;
    height: 100%;
    padding: clamp(6px, 1vh, 16px) clamp(8px, 1vw, 16px);
    display: flex;
    flex-direction: column;
    justify-content: space-between; 
    background: var(--panel);
  }

  .vn-title {
    font-size: clamp(9px, 1.2vmin, 14px);
    font-weight: 700;
    color: #8b98a5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .live-tag {
    font-size: clamp(7px, 0.8vw, 11px);
    padding: 2px 6px;
    background: rgba(0, 200, 83, 0.15);
    color: var(--up);
    border-radius: 4px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  
  .live-dot {
    width: clamp(4px, 0.5vw, 6px);
    height: clamp(4px, 0.5vw, 6px);
    border-radius: 50%;
    background: var(--up);
    animation: blink 1.5s infinite;
  }

  @keyframes blink {
    0% { opacity: 1; }
    50% { opacity: 0.3; }
    100% { opacity: 1; }
  }

  .vn-price-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(4px, 1vw, 12px);
    margin: auto 0; 
  }

  .price-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .price-label {
    font-size: clamp(8px, 1vmin, 12px);
    color: #6e7681;
    margin-bottom: 2px;
  }

  .price-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(16px, 3vmin, 26px); 
    font-weight: 700;
    transition: color 0.3s ease;
  }
  .buy-color { color: var(--down); }
  .sell-color { color: var(--up); }

  .price-val.flash-up { color: var(--up) !important; }
  .price-val.flash-down { color: var(--down) !important; }

  .vn-footer {
    font-size: clamp(7px, 0.8vw, 11px);
    color: #484f58;
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ==========================================
     SỬA LỖI RESPONSIVE CHO ĐIỆN THOẠI (ÉP XẾP CHỒNG 100%)
     ========================================== */
  @media (max-width: 850px) {
    body { 
      padding: 6px; 
      height: auto; 
      overflow-y: auto; 
    } 
    .wrap { 
      /* CHUYỂN SANG FLEX COLUMN ĐỂ CHẮC CHẮN BIỂU ĐỒ NẰM TRÊN, GIÁ NẰM DƯỚI */
      display: flex !important;
      flex-direction: column; 
      gap: 8px; 
      height: auto; 
    }
    .chart-panel { 
      width: 100%;
      height: 45vh; 
      min-height: 350px; 
    }
    .right-col { 
      width: 100%;
      display: grid; 
      grid-template-columns: 1fr 1fr; /* Chia 2 ô nhỏ bên dưới */
      gap: 6px; 
      height: auto;
    }
    .ticker { 
      min-height: 110px; 
    }
    .ticker:first-child { 
      grid-column: 1 / -1; /* Ép ô Bạc Phú Quý chiếm trọn 2 cột ngang */
      min-height: 130px; 
    }
    
    .chart-header { padding: 8px 12px; }
    .brand-logo { height: 40px; } /* Cỡ logo vừa vặn trên điện thoại */
  }

  /* ==========================================
     TỐI ƯU CHO MÀN HÌNH ANDROID Ô TÔ
     ========================================== */
  @media (max-height: 650px) and (min-width: 851px) and (orientation: landscape) {
    body { padding: 4px; overflow: hidden; } 
    .wrap { gap: 4px; grid-template-columns: minmax(0, 1fr) clamp(220px, 25vw, 300px); }
    .right-col { gap: 4px; }
    .ticker { min-height: 0; border-radius: 4px; }
    .vn-silver-card { padding: 4px 6px; gap: 0; justify-content: space-evenly; }
    .vn-price-grid { margin: 2px 0; gap: 4px; }
    .vn-title { font-size: 9px !important; }
    
    .chart-header { padding: 6px 12px; }
    .brand-logo { height: 35px; } 
    
    .ticker:first-child .price-val { font-size: 26px !important; }
    .ticker:first-child .price-label { font-size: 9px !important; margin-bottom: 2px; }

    .price-label { font-size: 7px !important; margin-bottom: 0; }
    .live-tag { font-size: 7px; padding: 2px 4px; }
    .vn-footer { font-size: 7px !important; }
    .source-badge { display: none; } 
  }

  /* ==========================================
     PHÓNG TO CHO MÀN TIVI 4K
     ========================================== */
  @media (min-width: 2160px) {
    html { zoom: 1.5; }
    .brand-logo { height: 75px; } 
  }
</style>
<script>
  if (/SmartTV|Tizen|Web0S|TV|NetCast|Viera|BRAVIA/i.test(navigator.userAgent)) {
    var viewportMeta = document.querySelector('meta[name="viewport"]');
    if (viewportMeta) {
      viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1.5, minimum-scale=1.5, maximum-scale=3.0');
    }
  }
</script>
</head>
<body>

<div class="wrap">

  <div class="panel chart-panel">
    <div class="chart-header">
      <img src="logo.png" alt="Logo Bảo Tín Thanh Thủy" class="brand-logo">
      <span class="dot"></span> Bạc / Đô la Mỹ (XAG/USD) · OANDA
    </div>
    <div id="tv_chart"></div>
  </div>

  <div class="right-col">

    <!-- 1. BẠC VN (PHÚ QUÝ) -->
    <div class="ticker">
      <div class="vn-silver-card">
        <div class="vn-title">
          <span>BẠC VN (PHÚ QUÝ)</span>
          <span class="live-tag"><span class="live-dot"></span> LIVE WORKER</span>
        </div>
        <div class="vn-price-grid">
          <div class="price-box">
            <span class="price-label">MUA VÀO (tr/Kg)</span>
            <span class="price-val buy-color" id="buy_price">--.---</span>
          </div>
          <div class="price-box">
            <span class="price-label">BÁN RA (tr/Kg)</span>
            <span class="price-val sell-color" id="sell_price">--.---</span>
          </div>
        </div>
        <div class="vn-footer" id="update_time">Đang kết nối...</div>
      </div>
    </div>

    <!-- 2. BẠC QUỐC TẾ XAGUSD -->
    <div class="ticker">
      <div class="source-badge">Nguồn: OANDA</div>
      <div class="widget-box">
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
        {
        "symbol": "OANDA:XAGUSD",
        "width": "100%",
        "colorTheme": "dark",
        "isTransparent": true,
        "locale": "vi_VN"
        }
        </script>
      </div>
    </div>

    <!-- 3. VÀNG QUỐC TẾ XAUUSD -->
    <div class="ticker">
      <div class="source-badge">Nguồn: OANDA</div>
      <div class="widget-box">
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
        {
        "symbol": "OANDA:XAUUSD",
        "width": "100%",
        "colorTheme": "dark",
        "isTransparent": true,
        "locale": "vi_VN"
        }
        </script>
      </div>
    </div>

    <!-- 4. DẦU THÔ UKOIL -->
    <div class="ticker">
      <div class="source-badge">Nguồn: TVC</div>
      <div class="widget-box">
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
        {
        "symbol": "TVC:UKOIL",
        "width": "100%",
        "colorTheme": "dark",
        "isTransparent": true,
        "locale": "vi_VN"
        }
        </script>
      </div>
    </div>

    <!-- 5. CHỈ SỐ DXY -->
    <div class="ticker">
      <div class="source-badge">Nguồn: CAPITALCOM</div>
      <div class="widget-box">
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
        {
        "symbol": "CAPITALCOM:DXY",
        "width": "100%",
        "colorTheme": "dark",
        "isTransparent": true,
        "locale": "vi_VN"
        }
        </script>
      </div>
    </div>

  </div>

</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
  new TradingView.widget({
    "container_id": "tv_chart",
    "autosize": true,
    "symbol": "OANDA:XAGUSD",
    "interval": "1",
    "timezone": "Asia/Ho_Chi_Minh",
    "theme": "dark",
    "style": "1",
    "locale": "vi_VN",
    "toolbar_bg": "#12161a",
    "enable_publishing": false,
    "hide_top_toolbar": false,
    "hide_legend": false,
    "save_image": false,
    "backgroundColor": "#12161a",
    "gridColor": "rgba(255,255,255,0.06)",
    "enabled_features": ["left_toolbar"],
    "studies": [] 
  });

  const WORKER_URL = 'https://giabac.quyetyhct.workers.dev/gia-bac';
  let lastBuy = 0;
  let lastSell = 0;

  async function fetchVNSilverPrice() {
    try {
      const response = await fetch(WORKER_URL);
      if (response.ok) {
        const data = await response.json();
        const buyVal = data.buyRaw ? (parseFloat(data.buyRaw) / 1000000) : parseFloat(data.buy);
        const sellVal = data.sellRaw ? (parseFloat(data.sellRaw) / 1000000) : parseFloat(data.sell);

        if (!isNaN(buyVal) && !isNaN(sellVal)) {
          updatePrice(buyVal, sellVal);
          return;
        }
      }
      showErrorState("Lỗi định dạng API");
    } catch (e) {
      console.error("Lỗi khi kết nối Worker:", e);
      showErrorState("Không thể kết nối API");
    }
  }

  function updatePrice(buyVal, sellVal) {
    const buyEl = document.getElementById('buy_price');
    const sellEl = document.getElementById('sell_price');
    const timeEl = document.getElementById('update_time');

    applyPriceWithFlash(buyEl, buyVal, lastBuy);
    applyPriceWithFlash(sellEl, sellVal, lastSell);

    lastBuy = buyVal;
    lastSell = sellVal;

    const now = new Date();
    timeEl.innerText = 'Cập nhật: ' + now.toLocaleTimeString('vi-VN');
  }

  function showErrorState(msg) {
    const timeEl = document.getElementById('update_time');
    timeEl.innerText = msg;
  }

  function applyPriceWithFlash(element, newVal, oldVal) {
    element.innerText = newVal.toFixed(3).replace('.', ',');
    if (oldVal > 0) {
      if (newVal > oldVal) {
        element.classList.add('flash-up');
        setTimeout(() => element.classList.remove('flash-up'), 1000);
      } else if (newVal < oldVal) {
        element.classList.add('flash-down');
        setTimeout(() => element.classList.remove('flash-down'), 1000);
      }
    }
  }

  fetchVNSilverPrice();
  setInterval(fetchVNSilverPrice, 10000);
</script>

</body>
</html>
